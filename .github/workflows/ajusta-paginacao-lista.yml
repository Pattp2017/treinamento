name: Ajusta paginacao da lista

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ajusta-paginacao-lista.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Numerar participantes e alinhar nomes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lista-presenca-github.js')
          s=p.read_text(encoding='utf-8')

          # Numera de forma sequencial usando a posicao original da turma.
          s=s.replace("function tabelaParticipantes(participantes,comCabecalho=true){const linhas=participantes.map(p=>`<tr><td>${esc(p.nome)}</td><td>${esc(formatarCPF(p.cpf))}</td><td class=\"assinatura\"></td></tr>`).join('');return `<table class=\"participantes\">${comCabecalho?'<thead><tr class=\"faixa\"><th>NOME</th><th>CPF</th><th>ASSINATURA</th></tr></thead>':''}<tbody>${linhas}</tbody></table>`;}", "function tabelaParticipantes(participantes,comCabecalho=true){const linhas=participantes.map((p,i)=>`<tr><td class=\"numero-participante\">${esc(p.numero??(i+1))}</td><td class=\"nome-participante\">${esc(p.nome)}</td><td>${esc(formatarCPF(p.cpf))}</td><td class=\"assinatura\"></td></tr>`).join('');return `<table class=\"participantes\">${comCabecalho?'<thead><tr class=\"faixa\"><th>Nº</th><th>NOME</th><th>CPF</th><th>ASSINATURA</th></tr></thead>':''}<tbody>${linhas}</tbody></table>`;}")

          # CSS: numero estreito, nome alinhado a esquerda, demais colunas preservadas.
          s=s.replace('.participantes td:nth-child(1){width:34%;font-weight:600;text-align:center}.participantes td:nth-child(2){width:20%;font-weight:600;text-align:center}.participantes td:nth-child(3){width:46%}', '.participantes th:nth-child(1),.participantes td:nth-child(1){width:6%;text-align:center}.participantes th:nth-child(2),.participantes td:nth-child(2){width:32%}.participantes td:nth-child(2){font-weight:600;text-align:left}.participantes th:nth-child(3),.participantes td:nth-child(3){width:20%;text-align:center}.participantes th:nth-child(4),.participantes td:nth-child(4){width:42%}')

          # Na medicao da primeira pagina preserva numero/nome/cpf.
          s=s.replace("participantes.push({nome:tr.cells[0]?.textContent||'',cpf:tr.cells[1]?.textContent||''})", "participantes.push({numero:tr.cells[0]?.textContent||'',nome:tr.cells[1]?.textContent||'',cpf:tr.cells[2]?.textContent||''})")
          s=s.replace("tr.innerHTML='<td>'+esc(p.nome)+'</td><td>'+esc(p.cpf)+'</td><td class=\"assinatura\"></td>'", "tr.innerHTML='<td class=\"numero-participante\">'+esc(p.numero)+'</td><td class=\"nome-participante\">'+esc(p.nome)+'</td><td>'+esc(p.cpf)+'</td><td class=\"assinatura\"></td>'")

          # Antes de gerar, garante numeracao global, inclusive nas paginas seguintes.
          s=s.replace("function htmlImpressao(turma,participantes,identidade){const cor=", "function htmlImpressao(turma,participantes,identidade){participantes=(participantes||[]).map((p,i)=>({...p,numero:i+1}));const cor=")

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lista-presenca-github.js
          git diff --cached --quiet && exit 0
          git commit -m 'Numera participantes e alinha nomes a esquerda'
          git push
