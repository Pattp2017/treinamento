name: Ajusta paginacao da lista

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ajusta-paginacao-lista.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fixar geometria A4 da lista
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lista-presenca-github.js')
          s=p.read_text(encoding='utf-8')

          # Geometria aprovada da folha:
          # A4 = 29,7 cm
          # margem superior = 1,0 cm
          # cabecalho = 2,5 cm
          # area util apos cabecalho = 23,0 cm (ate 26,5 cm da folha)
          # seguranca = 0,6 cm
          # rodape = 1,8 cm (27,1 a 28,9 cm)
          # margem inferior = 0,8 cm
          s=s.replace('.pagina-lista{position:relative;width:210mm;height:297mm;padding:10mm 11mm 32mm;overflow:hidden;page-break-after:always;break-after:page}', '.pagina-lista{position:relative;width:210mm;height:297mm;padding:0 11mm;overflow:hidden;page-break-after:always;break-after:page}')
          s=s.replace('.conteudo-pagina{max-height:255mm;overflow:hidden}', '.conteudo-pagina{position:absolute;left:11mm;right:11mm;top:35mm;height:230mm;max-height:230mm;overflow:hidden}')
          s=s.replace('.cabecalho-doc{margin-bottom:10px}', '.cabecalho-doc{position:absolute;left:11mm;right:11mm;top:10mm;width:188mm;height:25mm;margin:0;table-layout:fixed}')
          s=s.replace('.logo-doc{width:20%;text-align:center;padding:5px}', '.logo-doc{width:20%;height:25mm;text-align:center;padding:2mm}')
          s=s.replace('.logo-img{max-width:170px;max-height:68px;object-fit:contain}', '.logo-img{max-width:100%;max-height:21mm;object-fit:contain}')
          s=s.replace('.titulo-doc{text-align:center;font-family:Georgia,serif;font-size:18px;height:30px}', '.titulo-doc{text-align:center;font-family:Georgia,serif;font-size:18px;height:10mm}')
          s=s.replace('.rodape-img,.rodape-texto{position:absolute;left:11mm;right:11mm;top:271mm;height:18mm;margin:0}', '.rodape-img,.rodape-texto{position:absolute;left:11mm;right:11mm;top:271mm;height:18mm;margin:0}')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lista-presenca-github.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fixa cabecalho de 2,5 cm e area util de 23 cm'
          git push
