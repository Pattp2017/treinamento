name: Ajusta paginacao da lista

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ajusta-paginacao-lista.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir quebra antes do cabecalho da pagina seguinte
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('lista-presenca-github.js')
          s=p.read_text(encoding='utf-8')

          # A pagina tem area util de 23 cm, iniciando em 3,5 cm e terminando em 26,5 cm.
          # O erro observado era permitir linhas demais na primeira pagina; elas vazavam
          # fisicamente para a folha seguinte e ficavam atras do cabecalho.
          old="function capacidadePrimeiraPagina(turma){const texto=String(turma.conteudo_programatico||turma.topicos_realizados||'');const linhas=texto.split(/\\r?\\n/).length;const caracteres=texto.length;const linhasVisuais=Math.max(linhas,Math.ceil(caracteres/105));if(linhasVisuais>=34)return 5;if(linhasVisuais>=30)return 6;if(linhasVisuais>=26)return 7;if(linhasVisuais>=22)return 8;if(linhasVisuais>=18)return 9;if(linhasVisuais>=14)return 10;return 11;}"
          new="function capacidadePrimeiraPagina(turma){const texto=String(turma.conteudo_programatico||turma.topicos_realizados||'');const linhas=texto.split(/\\r?\\n/).length;const caracteres=texto.length;const linhasVisuais=Math.max(linhas,Math.ceil(caracteres/105));if(linhasVisuais>=34)return 2;if(linhasVisuais>=30)return 3;if(linhasVisuais>=26)return 4;if(linhasVisuais>=22)return 5;if(linhasVisuais>=18)return 6;if(linhasVisuais>=14)return 7;return 8;}"
          if old not in s:
              raise SystemExit('Trecho capacidadePrimeiraPagina nao encontrado; nenhuma alteracao aplicada.')
          s=s.replace(old,new)

          # Nas paginas de continuacao, o conteudo comeca rigorosamente depois do cabecalho.
          # Cria uma classe especifica para impedir qualquer deslocamento herdado.
          s=s.replace('<div class=\"conteudo-pagina\">${i===0?conteudoPrimeira:\'\'}${tabelaParticipantes(g,i===0)}</div>', '<div class=\"conteudo-pagina ${i===0?\'pagina-primeira\':\'pagina-continuacao\'}\">${i===0?conteudoPrimeira:\'\'}${tabelaParticipantes(g,i===0)}</div>')
          s=s.replace('.conteudo-pagina{position:absolute;left:11mm;right:11mm;top:35mm;height:230mm;max-height:230mm;overflow:hidden}', '.conteudo-pagina{position:absolute;left:11mm;right:11mm;top:35mm;height:230mm;max-height:230mm;overflow:hidden}.pagina-continuacao{top:35mm!important;height:230mm!important;max-height:230mm!important;padding-top:0!important;margin-top:0!important}')

          # Evita quebra de uma linha de participante no meio.
          s=s.replace('.assinatura{height:34px}', '.participantes tr{break-inside:avoid;page-break-inside:avoid}.assinatura{height:34px}')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lista-presenca-github.js
          git diff --cached --quiet && exit 0
          git commit -m 'Corrige linhas ocultas sob cabecalho da segunda pagina'
          git push
