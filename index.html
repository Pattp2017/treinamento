<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Treinamento 2.0</title>
<style>
:root{--verde:#0b8f43;--verde-escuro:#066331;--fundo:#f5f7f7;--branco:#fff;--borda:#dde6e3;--texto:#2d3436;--cinza:#6c757d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--fundo);color:var(--texto)}.app{display:flex;min-height:100vh}.sidebar{width:240px;background:#fff;color:#344054;padding:12px 10px;display:flex;flex-direction:column;border-right:1px solid var(--borda);transition:width .2s ease;overflow:hidden;flex:0 0 auto}.sidebar.recolhida{width:64px}.sidebar-header{height:62px;display:flex;align-items:center;gap:9px;margin-bottom:16px;overflow:hidden}.sidebar-toggle{width:40px;height:40px;min-width:40px;border:1px solid var(--borda);border-radius:9px;background:#f8fafc;color:#475467;cursor:pointer;display:flex;align-items:center;justify-content:center}.sidebar-toggle svg{width:21px;height:21px}.marca{flex:1;min-width:0;padding:0;overflow:hidden;opacity:1;transition:.2s}.sidebar.recolhida .marca{width:0;opacity:0}.marca-logo{display:none;width:100%;max-width:154px;max-height:54px;object-fit:contain}.marca-logo.visivel{display:block}.logo{font-size:15px;font-weight:700;color:#101828;white-space:nowrap}.logo-sub{display:none}.menu-item{height:42px;padding:10px 11px;border-radius:9px;cursor:pointer;margin-bottom:5px;font-size:14px;white-space:nowrap;overflow:hidden;display:flex;align-items:center;color:#475467;transition:.15s}.menu-item:hover{background:#f4f6f8;color:#101828}.menu-item.ativo{background:color-mix(in srgb,var(--verde) 11%,white);color:var(--verde-escuro);font-weight:700}.menu-icone{width:21px;min-width:21px;height:21px;margin-right:11px;display:flex;align-items:center;justify-content:center}.menu-icone svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.menu-texto{opacity:1;transition:.15s}.sidebar.recolhida .menu-texto{opacity:0}.sidebar.recolhida .menu-item{padding-left:11px}.sidebar-footer{margin-top:auto;padding:8px 10px;font-size:11px;color:#98a2b3;white-space:nowrap;transition:.15s}.sidebar.recolhida .sidebar-footer{opacity:0}.main{flex:1;min-width:0;display:flex;flex-direction:column}.topbar{height:62px;background:#fff;border-bottom:1px solid var(--borda);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.titulo-pagina{font-size:19px;font-weight:700;color:#101828}.usuario{font-size:13px;color:var(--cinza)}.conteudo{padding:22px;width:100%;max-width:1500px;margin:0}.card{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:20px;box-shadow:0 3px 10px rgba(16,24,40,.035);margin-bottom:20px}.card h2,.card h3{margin-top:0;color:var(--verde-escuro)}.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.status{display:inline-block;padding:6px 10px;border-radius:999px;background:#eaf6ef;color:var(--verde-escuro);font-size:12px;font-weight:bold}.status-alerta{background:#fff3cd;color:#7a5a00}.btn{border:1px solid var(--borda);background:#fff;border-radius:9px;padding:10px 14px;cursor:pointer}.btn.primario{background:var(--verde);color:#fff;border-color:var(--verde)}.btn.secundario{background:#f3f4f6}.acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}.aviso{margin:12px 0;color:#7a5a00;font-size:13px}label{display:block;font-size:13px;font-weight:bold;margin-bottom:10px}input,select,textarea{width:100%;margin-top:6px;padding:10px;border:1px solid var(--borda);border-radius:9px;font:inherit}.agenda-topo{display:flex;justify-content:space-between;align-items:center;gap:16px}.agenda-controles{display:flex;align-items:center;gap:10px}.agenda-semana,.agenda-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.agenda-semana{font-weight:700;text-align:center;margin:10px 0}.agenda-dia{min-height:112px;background:#f8fafc;border:1px solid #dbe3ef;border-radius:10px;padding:6px;cursor:pointer;min-width:0}.agenda-dia.vazio{background:transparent;border:none}.agenda-numero{font-weight:700;margin-bottom:4px}.agenda-card{background:#fff;border-left:4px solid var(--verde);border-radius:8px;padding:5px;margin-top:5px;font-size:11px;box-shadow:0 2px 7px rgba(0,0,0,.08);max-width:100%;overflow:hidden}.agenda-card strong,.agenda-card span,.agenda-card small{display:block}.agenda-card .etapa{margin-top:3px;font-size:10px;color:var(--cinza)}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:99}.modal.oculto{display:none}.modal-box{background:#fff;width:min(700px,95vw);max-height:90vh;overflow:auto;border-radius:16px;padding:22px}.grid-form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid-form .full{grid-column:1/-1}@media(max-width:900px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:120;width:235px;box-shadow:4px 0 18px rgba(0,0,0,.12)}.sidebar.recolhida{width:56px}.main{margin-left:56px}.grid-3,.grid-form,.dash-resumo{grid-template-columns:1fr!important}.agenda-semana,.agenda-grade{grid-template-columns:repeat(7,minmax(80px,1fr));min-width:590px}.conteudo{padding:14px;overflow-x:auto}.agenda-topo{align-items:flex-start;flex-direction:column}.usuario{display:none}}
</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="sidebar-header"><button class="sidebar-toggle" id="sidebarToggle" title="Recolher/abrir menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="marca"><img id="marcaLogo" class="marca-logo" alt="Logo da empresa"><div id="marcaNome" class="logo">Treinamento 2.0</div><div id="marcaSubtitulo" class="logo-sub">Gestão de Treinamentos</div></div></div>

<div class="menu-item" data-modulo="Configuracoes"><span class="menu-icone"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 8.97 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3v-4h.08A1.7 1.7 0 0 0 4.6 8.97a1.7 1.7 0 0 0-.34-1.88l-.06-.06L7.03 4.2l.06.06A1.7 1.7 0 0 0 8.97 4.6 1.7 1.7 0 0 0 10 3.08V3h4v.08a1.7 1.7 0 0 0 1.03 1.52 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06a1.7 1.7 0 0 0-.34 1.88A1.7 1.7 0 0 0 20.92 10H21v4h-.08A1.7 1.7 0 0 0 19.4 15z"/></svg></span><span class="menu-texto">Configurações</span></div><div class="sidebar-footer">Sistema de Treinamentos<br>Versão 2.0</div></aside><main class="main"><header class="topbar"><div id="tituloPagina" class="titulo-pagina">Dashboard</div><div id="usuarioSistema" class="usuario">Sistema de Treinamentos</div></header><section id="conteudoPrincipal" class="conteudo"><div class="card">Carregando dashboard...</div></section></main></div><script src="supabase-config.js"></script><script src="configuracoes-github.js"></script><script src="configuracoes-fundo-github.js"></script><script src="cadastros-github.js"></script><script src="empresas-github.js"></script><script src="treinamentos-github.js"></script><script src="historico-github.js"></script><script src="lista-presenca-github.js"></script><script src="certificados-github.js"></script><script src="agenda-github.js"></script><script src="agenda-cadastros-github.js"></script><script src="turmas-github.js"></script><script src="dashboard-github.js"></script><script>
const sidebar=document.getElementById('sidebar');if(window.innerWidth<=900)sidebar.classList.add('recolhida');document.getElementById('sidebarToggle').addEventListener('click',e=>{e.stopPropagation();sidebar.classList.toggle('recolhida');});function escurecerHex(hex,percentual=.28){const h=String(hex||'').replace('#','');if(!/^[0-9a-fA-F]{6}$/.test(h))return'#066331';const f=parseInt(h,16),r=(f>>16)&255,g=(f>>8)&255,b=f&255,k=1-percentual;return'#'+[r,g,b].map(v=>Math.max(0,Math.round(v*k)).toString(16).padStart(2,'0')).join('');}function aplicarIdentidadeSistema(c){if(!c)return;const cor=c.cor_principal||'#0b8f43';document.documentElement.style.setProperty('--verde',cor);document.documentElement.style.setProperty('--verde-escuro',escurecerHex(cor));const logo=document.getElementById('marcaLogo');if(c.logo_url){logo.src=c.logo_url;logo.classList.add('visivel');logo.onerror=()=>logo.classList.remove('visivel');}else logo.classList.remove('visivel');document.getElementById('marcaNome').textContent=c.nome_exibicao||'Treinamento 2.0';document.getElementById('marcaSubtitulo').textContent=c.subtitulo||'Gestão de Treinamentos';document.getElementById('usuarioSistema').textContent=c.nome_exibicao||'Sistema de Treinamentos';}if(window.carregarIdentidadeEmpresaGithub)window.carregarIdentidadeEmpresaGithub().then(aplicarIdentidadeSistema);document.querySelectorAll('.menu-item').forEach(item=>item.addEventListener('click',async()=>{document.querySelectorAll('.menu-item').forEach(i=>i.classList.remove('ativo'));item.classList.add('ativo');const modulo=item.dataset.modulo;document.getElementById('tituloPagina').textContent=modulo==='Historico'?'Histórico':modulo;if(window.innerWidth<=900)sidebar.classList.add('recolhida');if(modulo==='Dashboard'&&window.renderDashboardGithub){await window.renderDashboardGithub();return}if(modulo==='Cadastros'&&window.renderCadastrosGithub){await window.renderCadastrosGithub();return}if(modulo==='Agenda'&&window.renderAgendaGithub){await window.renderAgendaGithub();return}if(modulo==='Turmas'&&window.renderTurmasGithub){await window.renderTurmasGithub();return}if(modulo==='Historico'&&window.renderHistoricoGithub){await window.renderHistoricoGithub();return}if(modulo==='Configuracoes'&&window.renderConfiguracoesGithub){await window.renderConfiguracoesGithub();return}document.getElementById('conteudoPrincipal').innerHTML=`<div class="card"><h2>${modulo}</h2><p>Módulo em desenvolvimento.</p></div>`;}));window.addEventListener('DOMContentLoaded',()=>window.renderDashboardGithub&&window.renderDashboardGithub());
</script></body></html>
